name: Final website regression audit
on:
  push:
    branches: ['security/skillspector']
    paths: ['.github/workflows/final-website-regression.yml']
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8617b551f57d8303ac38c97b1c36edf11001419c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/portfolio-audit axe-core@4.10.3 lighthouse@12.3.0
      - name: Start local server
        run: |
          mkdir -p audit
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/ >/dev/null
      - name: Browser and accessibility checks
        run: |
          python - <<'PY'
          import json
          from urllib.parse import parse_qs
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('audit')
          axe=Path('/tmp/portfolio-audit/node_modules/axe-core/axe.min.js').read_text()
          results=[]
          base='http://127.0.0.1:8000'
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for lang,slug in [('es','/'),('en','/en/')]:
                  for width,height in [(375,812),(768,1024),(1440,900)]:
                      context=browser.new_context(viewport={'width':width,'height':height},reduced_motion='reduce')
                      page=context.new_page()
                      errors=[]
                      requests=[]
                      page.on('pageerror',lambda e: errors.append(str(e)))
                      page.on('request',lambda r: requests.append(r.url))
                      # No live submissions or analytics hits during automated testing.
                      page.route('https://gc.zgo.at/**',lambda route: route.fulfill(status=200,body='',content_type='application/javascript'))
                      page.route('https://jormanj2b.goatcounter.com/**',lambda route: route.fulfill(status=200,body=''))
                      submissions=[]
                      # Stub only the browser API locally; no real CAPTCHA token or email is generated.
                      page.route('https://www.google.com/recaptcha/api.js?**',lambda route: route.fulfill(status=200,content_type='application/javascript',body="""window.grecaptcha={render:function(el,opts){window.__testCaptchaOptions=opts;el.textContent='Mock verification';return 0},getResponse:function(){return window.__testCaptchaToken||''},reset:function(){window.__testCaptchaToken=''}};window.portfolioCaptchaReady();"""))
                      def intercept(route):
                          submissions.append(route.request.post_data_json)
                          route.fulfill(status=200,content_type='application/json',body='{"ok":true}',headers={'access-control-allow-origin':'*'})
                      page.route('https://formspree.io/f/mkjredvr',intercept)
                      page.goto(base+slug,wait_until='networkidle')
                      reject=page.get_by_role('button',name='Rechazar todas' if lang=='es' else 'Reject all',exact=True)
                      reject.wait_for(state='visible',timeout=10000)
                      before=any('gc.zgo.at' in u for u in requests)
                      reject.click()
                      page.wait_for_timeout(300)
                      after=any('gc.zgo.at' in u for u in requests)
                      page.evaluate('document.fonts.ready')
                      page.locator('footer').scroll_into_view_if_needed()
                      page.wait_for_timeout(300)
                      page.evaluate('Promise.all(Array.from(document.images).map(i => { i.loading="eager"; return i.decode().catch(()=>{}); }))')
                      page.evaluate('scrollTo(0,0)')
                      page.screenshot(path=str(out/f'{lang}-{width}.png'),full_page=True)
                      page.evaluate(axe)
                      a=page.evaluate('async () => await axe.run({runOnly:{type:"tag",values:["wcag2a","wcag2aa","wcag21a","wcag21aa"]}})')
                      bad_images=page.evaluate('Array.from(document.images).filter(i => !i.complete || i.naturalWidth===0).map(i => i.getAttribute("src"))')
                      overflow=page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                      active=page.locator('.lang a[aria-current="page"]').inner_text()
                      linkcount=page.locator('.project .go-row a.go:not(.go-alt)').count()
                      page.locator('#contacto-form button[type=submit]').click()
                      invalid_blocked=not submissions and page.locator('#form-error').is_visible()
                      page.locator('[name=nombre]').fill('123')
                      page.locator('#captcha-widget').get_by_text('Mock verification',exact=True).wait_for(state='visible',timeout=10000)
                      page.evaluate("window.__testCaptchaOptions['error-callback']()")
                      msg=page.locator('#captcha-status').inner_text()
                      expected='Verificación no disponible. Reintenta o utiliza una de las plataformas de contacto de arriba.' if lang=='es' else 'Security check unavailable. Please retry or use one of the contact platforms above.'
                      assert msg==expected, msg
                      print('CAPTCHA_FALLBACK',lang,width,msg,flush=True)
                      page.evaluate('window.__testCaptchaOptions.callback()')
                      name_filter=page.locator('[name=nombre]').input_value()==''
                      page.locator('[name=nombre]').fill('Test User')
                      page.locator('[name=negocio]').fill('Test business')
                      page.locator('[name=tipo]').select_option(index=1)
                      page.locator('[name=contacto]').fill('invalid')
                      page.locator('#contacto-form button[type=submit]').click()
                      email_blocked=not submissions and page.locator('#form-error').is_visible()
                      page.locator('[name=contacto]').fill('test@example.com')
                      page.locator('[name=nota]').fill('Automated test; intercepted locally.')
                      page.locator('#contacto-form button[type=submit]').click()
                      captcha_blocked=not submissions and page.locator('#form-error').is_visible()
                      page.evaluate("window.__testCaptchaToken='local-mock-only'")
                      page.locator('#contacto-form button[type=submit]').click()
                      page.locator('#enviado').wait_for(state='visible',timeout=10000)
                      form_ok=len(submissions)==1 and submissions[0].get('email')=='test@example.com' and submissions[0].get('language')==lang and submissions[0].get('g-recaptcha-response')=='local-mock-only'
                      page.goto(base+slug+'#contacto')
                      other='EN' if lang=='es' else 'ES'
                      link=page.locator('.lang a').filter(has_text=other)
                      link.click()
                      switch_ok=page.url.endswith(('/en/' if lang=='es' else '/')+'#contacto')
                      result={'language':lang,'width':width,'height':height,'overflow':overflow,'broken_images':bad_images,'active_language':active,'project_links':linkcount,'analytics_before_consent':before,'analytics_after_reject':after,'empty_form_blocked':invalid_blocked,'name_filter':name_filter,'bad_email_blocked':email_blocked,'captcha_missing_blocked':captcha_blocked,'mock_submission_ok':form_ok,'switch_preserves_anchor':switch_ok,'page_errors':errors,'axe_violations':[{'id':v['id'],'impact':v['impact'],'description':v['description'],'nodes':[n['target'] for n in v['nodes']]} for v in a['violations']]}
                      result['captcha_fallback_correct']=msg==expected
                      results.append(result)
                      print(json.dumps(result,ensure_ascii=False),flush=True)
                      (out/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
                      context.close()
              browser.close()
          assert len(results)==6
          assert all(not r['overflow'] and not r['broken_images'] and not r['page_errors'] and not r['axe_violations'] and r['captcha_fallback_correct'] and r['mock_submission_ok'] and r['captcha_missing_blocked'] and r['empty_form_blocked'] and r['bad_email_blocked'] and r['switch_preserves_anchor'] and not r['analytics_before_consent'] and not r['analytics_after_reject'] for r in results), 'Regression in portfolio checks'
          PY
      - name: Lighthouse mobile audit
        if: always()
        run: |
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          for lang in es en; do
            path=/
            if [ "$lang" = en ]; then path=/en/; fi
            /tmp/portfolio-audit/node_modules/.bin/lighthouse "http://127.0.0.1:8000${path}" --chrome-flags="--headless --no-sandbox" --output=json --output-path="audit/lighthouse-${lang}.json" --quiet || true
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for f in Path('audit').glob('lighthouse-*.json'):
              data=json.loads(f.read_text())
              print(f.name, {k:round(v['score']*100) if v['score'] is not None else None for k,v in data['categories'].items()})
          PY
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-audit
          path: audit/
  demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and axe
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/demo-audit axe-core@4.10.3
      - name: Inspect all six bilingual demos without submitting forms
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('demo-audit')
          out.mkdir(exist_ok=True)
          axe=Path('/tmp/demo-audit/node_modules/axe-core/axe.min.js').read_text()
          results=[]
          slugs=['laborathorno-demo','demo-barberia','demo-cafe','demo-tienda','demo-asesoria','demo-gimnasio']
          versions={'laborathorno-demo':'styles.css?v=5','demo-tienda':'styles.css?v=5'}
          def verify_release(item):
              slug,lang,marker=item
              url='https://jormanbravo.com/'+slug+'/'+('en/' if lang=='en' else '')
              deadline=time.monotonic()+480
              while time.monotonic()<deadline:
                  try:
                      req=urllib.request.Request(url+'?audit='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as res:
                          if marker in res.read().decode('utf-8'):
                              print('RELEASE_READY',slug,lang,marker,flush=True)
                              return True
                  except Exception as exc:
                      last_error=str(exc)
                  time.sleep(10)
              print('RELEASE_PENDING',slug,lang,marker,flush=True)
              return False
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(verify_release,[(slug,lang,marker) for slug,marker in versions.items() for lang in ('es','en')]))
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for slug in slugs:
                  for lang in ('es','en'):
                      sizes=[(375,812),(768,1024),(1440,900)]
                      if slug in versions: sizes += [(320,720),(900,900),(1024,768),(1200,900),(1201,900)]
                      for w,h in sizes:
                          c=browser.new_context(viewport={'width':w,'height':h},reduced_motion='reduce')
                          page=c.new_page()
                          errors=[]
                          page.on('pageerror',lambda e: errors.append(str(e)))
                          # Read only: block all non-GET/HEAD requests, analytics and off-site requests.
                          def guard(route):
                              req=route.request
                              if req.method not in ('GET','HEAD') or not req.url.startswith('https://jormanbravo.com/'):
                                  route.abort()
                              else:
                                  route.continue_()
                          page.route('**/*',guard)
                          url='https://jormanbravo.com/'+slug+'/'+('en/' if lang=='en' else '')
                          result={'demo':slug,'language':lang,'width':w}
                          try:
                              res=page.goto(url+'?audit='+str(time.time_ns()),wait_until='domcontentloaded',timeout=30000)
                              page.wait_for_timeout(500)
                              result['status']=res.status if res else None
                              result['actual_lang']=page.locator('html').get_attribute('lang')
                              result['title']=page.title()
                              page.evaluate('document.fonts.ready')
                              result['overflow_before_consent']=page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                              for label in ['Reject all','Rechazar todas','Reject all cookies','Rechazar todas las cookies']:
                                  b=page.get_by_role('button',name=label,exact=True).first
                                  if b.is_visible():
                                      b.click()
                                      break
                              page.evaluate('document.fonts.ready')
                              if slug in versions:
                                  result['updated_css']=any(versions[slug] in href for href in page.locator('link[rel=stylesheet]').evaluate_all('(els)=>els.map(e=>e.href)'))
                              if slug=='laborathorno-demo' and w<=1200 and result.get('updated_css',False):
                                  menu=page.locator('.menu-btn')
                                  menu.click()
                                  result['menu_works']=menu.get_attribute('aria-expanded')=='true' and page.locator('#main-nav').is_visible()
                                  menu.click()
                                  result['menu_works']=result['menu_works'] and menu.get_attribute('aria-expanded')=='false'
                              page.evaluate('Promise.allSettled(Array.from(document.images).map(i=>{i.loading="eager";return i.decode()}))')
                              page.wait_for_timeout(300)
                              result['overflow']=page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                              if result['overflow']:
                                  result['overflow_elements']=page.evaluate("""()=>[...document.querySelectorAll('body *')].map(e=>({e,r:e.getBoundingClientRect()})).filter(({e,r})=>r.width>0&&r.right>innerWidth+1&&getComputedStyle(e).visibility==='visible'&&!e.closest('.ribbon,.cart-drawer,.section,.hero,.volume,.site-footer,svg')).map(({e,r})=>({tag:e.tagName,cls:String(e.className),right:Math.round(r.right)})).slice(0,30)""")
                              result['broken_images']=page.evaluate('Array.from(document.images).filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute("src"))')
                              if slug=='demo-tienda':
                                  result['oil_image_loaded']=page.evaluate("Array.from(document.images).filter(i=>i.src.includes('aceitera')).some(i=>i.complete && i.naturalWidth>0)")
                              result['h1_count']=page.locator('h1').count()
                              result['canonical']=page.locator('link[rel=canonical]').first.get_attribute('href') if page.locator('link[rel=canonical]').count() else None
                              page.evaluate(axe)
                              a=page.evaluate('async()=>await axe.run({runOnly:{type:"tag",values:["wcag2a","wcag2aa","wcag21a","wcag21aa"]}})')
                              result['axe']=[{'id':v['id'],'impact':v['impact'],'nodes':[n['target'] for n in v['nodes']]} for v in a['violations']]
                              result['page_errors']=errors
                              page.screenshot(path=str(out/f'{slug}-{lang}-{w}.png'),full_page=False)
                          except Exception as exc:
                              result['error']=str(exc)
                          print(json.dumps(result,ensure_ascii=False),flush=True)
                          results.append(result)
                          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
                          c.close()
              browser.close()
          assert len(results)==56, len(results)
          assert all(r.get('status')==200 and not r.get('error') and not r.get('overflow') and not r.get('overflow_before_consent') and not r.get('broken_images') and not r.get('page_errors') and not r.get('axe') and r.get('updated_css',True) and r.get('menu_works',True) and r.get('oil_image_loaded',True) and r.get('h1_count')==1 for r in results), 'Demo checks reported one or more issues'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-audit
          path: demo-audit/

name: SkillSpector bootstrap
on:
  push:
    branches: ['security/skillspector']
    paths: ['.github/workflows/skillspector-bootstrap.yml']
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install pinned scanner in isolated environment
        run: |
          python3 -m venv /tmp/skillspector
          /tmp/skillspector/bin/python -m pip install 'git+https://github.com/NVIDIA/SkillSpector.git@02894ec5b8a0a70637df5a6b45763de92940cedd'
          /tmp/skillspector/bin/skillspector --version
          /tmp/skillspector/bin/skillspector scan --help

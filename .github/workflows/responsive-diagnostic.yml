name: Responsive issue diagnosis
on:
  push:
    branches: ['security/skillspector']
    paths: ['.github/workflows/responsive-diagnostic.yml']
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Inspect original overflow and actual image decoding
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for slug,lang,w in [('laborathorno-demo','es',768),('laborathorno-demo','en',768),('laborathorno-demo','es',900),('demo-tienda','es',375),('demo-tienda','en',375)]:
                  ctx=browser.new_context(viewport={'width':w,'height':900},reduced_motion='reduce')
                  page=ctx.new_page()
                  page.route('**/*',lambda r:r.continue_() if r.request.method in ('GET','HEAD') and r.request.url.startswith('https://jormanbravo.com/') else r.abort())
                  page.goto('https://jormanbravo.com/'+slug+'/'+('en/' if lang=='en' else ''),wait_until='domcontentloaded')
                  page.evaluate('document.fonts.ready')
                  page.wait_for_timeout(500)
                  for label in ['Reject all','Rechazar todas','Reject all cookies','Rechazar todas las cookies']:
                      b=page.get_by_role('button',name=label,exact=True).first
                      if b.is_visible(): b.click(); break
                  print('DIAG',slug,lang,w,json.dumps(page.evaluate("""async()=>{for(const i of document.images){i.loading='eager'} await Promise.allSettled([...document.images].map(i=>i.decode()));return {width:document.documentElement.scrollWidth,overflow:[...document.querySelectorAll('body *')].map(e=>({e,r:e.getBoundingClientRect()})).filter(({e,r})=>r.width>0&&r.right>innerWidth+1&&getComputedStyle(e).position!=='fixed'&&!e.closest('svg')).sort((a,b)=>b.r.right-a.r.right).slice(0,24).map(({e,r})=>({tag:e.tagName,id:e.id,cls:String(e.className),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),parent:e.parentElement?.className})),images:[...document.images].filter(i=>i.src.includes('aceitera')).map(i=>({url:i.currentSrc,complete:i.complete,width:i.naturalWidth}))}}"""),ensure_ascii=False),flush=True)
                  ctx.close()
              page=browser.new_page()
              for suffix in ['400','800']:
                  u='https://jormanbravo.com/demo-tienda/img/aceitera-'+suffix+'.webp'
                  res=page.request.get(u)
                  page.goto(u)
                  result=page.evaluate("""async()=>{const i=document.querySelector('img');if(!i)return null;await i.decode().catch(()=>{});return {width:i.naturalWidth,height:i.naturalHeight}}""")
                  print('IMAGE',suffix,res.status,res.headers.get('content-type'),len(res.body()),json.dumps(result),flush=True)
              browser.close()
          PY
